<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cut the Cake</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px 14px 28px;text-align:center}
  .stage h1{font-size:clamp(34px,8vw,60px);color:var(--deep);text-shadow:0 4px 0 #fff,0 0 30px #ffd1e3;line-height:1.1}
  .stage .hint{font-size:clamp(15px,3.6vw,19px);max-width:520px;opacity:.85}
  .cake-wrap{position:relative;width:min(440px,92vw);aspect-ratio:400/380;touch-action:none;user-select:none}
  .cake-wrap svg.cake{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 18px rgba(214,54,111,.25))}
  .cake-wrap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
  .cake-wrap.cut svg.cake{animation:wobble .7s ease-in-out}
  @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg) scale(1.02)}75%{transform:rotate(2deg) scale(1.02)}}
  .flame{transform-origin:200px 74px;animation:flick .18s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px #ffd54a) drop-shadow(0 0 18px #ff9f43);transition:opacity .5s,transform .5s}
  @keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.92,1.1) rotate(2deg)}}
  .out .flame{opacity:0;transform:scale(.2)}
  .smoke{opacity:0}
  .out .smoke{animation:smoke 2s ease-out}
  @keyframes smoke{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
  .guide{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:9 9;stroke-linecap:round;opacity:.85;animation:dash 1.2s linear infinite;transition:opacity .6s}
  @keyframes dash{to{stroke-dashoffset:-36}}
  .started .guide{opacity:.15}
  .knife{position:absolute;left:0;top:0;width:54px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:3;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
  .knife.on{opacity:1}
  .bar{width:min(320px,80vw);height:16px;border-radius:99px;background:#fff;border:2px solid #ffc0d6;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.08)}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9dbf,#ff5c92);border-radius:99px;transition:width .15s}
  .slice{position:absolute;right:-6%;bottom:2%;width:34%;opacity:0;transform:translateX(-70px) rotate(-8deg) scale(.6);transition:all .9s cubic-bezier(.2,1.4,.4,1);pointer-events:none;filter:drop-shadow(0 8px 8px rgba(214,54,111,.3))}
  .cut .slice{opacity:1;transform:none}
  #msg{font-family:'Dancing Script',cursive;font-size:clamp(26px,6vw,38px);color:var(--deep);min-height:46px}
  #go{display:none}
  #go.show{display:inline-block;animation:pagein .6s}
  .skip{background:none;border:0;color:var(--ink);opacity:.55;font:600 14px Quicksand,sans-serif;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<main class="stage">
  <h1>Let's cut your cake! 🎂</h1>
  <p class="hint" id="hint">Drag your mouse (or finger) across the cake to slice it &mdash; follow the dotted triangle, or scribble any way you like!</p>

  <div class="cake-wrap" id="wrap">
    <svg class="cake" viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg" aria-label="Pink birthday cake with a candle">
      <defs>
        <linearGradient id="gBottom" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb7d0"/><stop offset="1" stop-color="#ff86b0"/></linearGradient>
        <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcfe0"/><stop offset="1" stop-color="#ffa0c3"/></linearGradient>
        <linearGradient id="gCandle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#ffd6e6"/><stop offset="1" stop-color="#ffb3d1"/></linearGradient>
        <radialGradient id="gFlame" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#fff9c4"/><stop offset=".5" stop-color="#ffd54a"/><stop offset="1" stop-color="#ff8a3d"/></radialGradient>
        <radialGradient id="gCherry" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff8a9b"/><stop offset="1" stop-color="#d4183d"/></radialGradient>
      </defs>
      <!-- plate -->
      <ellipse cx="200" cy="338" rx="190" ry="30" fill="#fff" stroke="#ffd1e3" stroke-width="3"/>
      <ellipse cx="200" cy="334" rx="160" ry="22" fill="#ffeef5"/>
      <!-- bottom tier -->
      <rect x="50" y="222" width="300" height="112" rx="20" fill="url(#gBottom)"/>
      <!-- top tier -->
      <rect x="105" y="142" width="190" height="82" rx="18" fill="url(#gTop)"/>
      <!-- pearls along the bottom -->
      <g fill="#fff" stroke="#ffd1e3" stroke-width="1">
        <circle cx="72" cy="322" r="6"/><circle cx="98" cy="326" r="6"/><circle cx="124" cy="328" r="6"/><circle cx="150" cy="329" r="6"/><circle cx="176" cy="330" r="6"/><circle cx="202" cy="330" r="6"/><circle cx="228" cy="330" r="6"/><circle cx="254" cy="329" r="6"/><circle cx="280" cy="328" r="6"/><circle cx="306" cy="326" r="6"/><circle cx="332" cy="322" r="6"/>
      </g>
      <!-- frosting drips -->
      <path d="M44 226 Q44 212 62 212 H338 Q356 212 356 226 Q356 240 342 240 Q334 240 334 252 Q334 266 322 266 Q310 266 310 252 Q310 242 298 242 Q286 242 286 254 Q286 262 276 262 Q266 262 266 250 Q266 240 254 240 Q242 240 242 250 Q242 270 230 270 Q218 270 218 250 Q218 240 206 240 Q194 240 194 252 Q194 262 184 262 Q174 262 174 250 Q174 240 160 240 Q146 240 146 254 Q146 268 134 268 Q122 268 122 252 Q122 242 108 242 Q94 242 94 254 Q94 262 84 262 Q74 262 74 250 Q74 240 58 240 Q44 240 44 226Z" fill="#fff4f8"/>
      <path d="M99 146 Q99 132 116 132 H284 Q301 132 301 146 Q301 158 290 158 Q282 158 282 168 Q282 180 272 180 Q262 180 262 168 Q262 160 250 160 Q238 160 238 170 Q238 184 226 184 Q214 184 214 170 Q214 160 202 160 Q190 160 190 170 Q190 178 180 178 Q170 178 170 166 Q170 158 156 158 Q144 158 144 170 Q144 182 133 182 Q122 182 122 168 Q122 158 110 158 Q99 158 99 146Z" fill="#fff4f8"/>
      <!-- sprinkles & hearts -->
      <g>
        <rect x="76" y="280" width="12" height="4" rx="2" fill="#fff" transform="rotate(25 82 282)"/><rect x="118" y="296" width="12" height="4" rx="2" fill="#ffe27a" transform="rotate(-30 124 298)"/><rect x="170" y="284" width="12" height="4" rx="2" fill="#bba6ff" transform="rotate(40 176 286)"/><rect x="230" y="298" width="12" height="4" rx="2" fill="#fff" transform="rotate(-20 236 300)"/><rect x="284" y="282" width="12" height="4" rx="2" fill="#ffe27a" transform="rotate(35 290 284)"/><rect x="318" y="300" width="12" height="4" rx="2" fill="#bba6ff" transform="rotate(-35 324 302)"/>
        <rect x="132" y="196" width="10" height="4" rx="2" fill="#fff" transform="rotate(30 137 198)"/><rect x="250" y="200" width="10" height="4" rx="2" fill="#ffe27a" transform="rotate(-30 255 202)"/><rect x="200" y="204" width="10" height="4" rx="2" fill="#bba6ff" transform="rotate(20 205 206)"/>
      </g>
      <g fill="#ff5c92" stroke="#fff" stroke-width="1.5"><path d="M92 270 c-6-6-14 2-6 8 l6 5 l6-5 c8-6 0-14-6-8z" transform="translate(6 -4)"/><path d="M300 262 c-6-6-14 2-6 8 l6 5 l6-5 c8-6 0-14-6-8z"/></g>
      <!-- cherries on top -->
      <circle cx="150" cy="134" r="9" fill="url(#gCherry)"/><circle cx="250" cy="134" r="9" fill="url(#gCherry)"/>
      <path d="M150 126 Q154 116 160 112 M250 126 Q246 116 240 112" stroke="#4d8f45" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- candle -->
      <rect x="191" y="82" width="18" height="56" rx="5" fill="url(#gCandle)" stroke="#ff9dbf" stroke-width="1.5"/>
      <path d="M193 96 L207 90 M193 108 L207 102 M193 120 L207 114" stroke="#ff8fb5" stroke-width="3" stroke-linecap="round" opacity=".8"/>
      <path d="M200 82 V74" stroke="#5b3a3a" stroke-width="2.5" stroke-linecap="round"/>
      <path class="smoke" d="M200 70 Q194 56 202 46 Q210 36 202 24" fill="none" stroke="#bbb" stroke-width="4" stroke-linecap="round"/>
      <path class="flame" d="M200 44 C212 58 214 72 200 76 C186 72 188 58 200 44Z" fill="url(#gFlame)"/>
      <!-- dotted triangle guide -->
      <path class="guide" d="M200 152 L112 322 L288 322 Z"/>
    </svg>
    <svg class="slice" viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <ellipse cx="60" cy="98" rx="56" ry="10" fill="#fff" stroke="#ffd1e3" stroke-width="2"/>
      <path d="M14 92 L100 92 L84 44 L30 44Z" fill="url(#gBottom)"/>
      <path d="M30 44 L84 44 L74 20 L40 20Z" fill="url(#gTop)"/>
      <path d="M26 46 Q40 56 52 46 Q66 58 88 44 L84 40 L30 40Z" fill="#fff4f8"/>
      <circle cx="57" cy="14" r="7" fill="#d4183d"/>
    </svg>
    <canvas id="cv"></canvas>
    <svg class="knife" id="knife" viewBox="0 0 60 30" aria-hidden="true"><path d="M2 12 L40 5 Q46 4 52 10 L40 14 Z" fill="#e8eef5" stroke="#8a97a8" stroke-width="1.5" stroke-linejoin="round"/><rect x="38" y="6" width="20" height="9" rx="4" fill="#ff7fa8" transform="rotate(-6 48 10)"/></svg>
  </div>

  <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  <div id="msg" aria-live="polite"></div>
  <button class="btn" id="go">Open my birthday surprise 💗</button>
  <button class="skip" id="skip">can't cut it? skip ›</button>
</main>

<script src="script.js"></script>
<script>
const wrap = document.getElementById('wrap'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const knife = document.getElementById('knife'), fill = document.getElementById('fill'), msg = document.getElementById('msg'), hint = document.getElementById('hint');
const VB = 400;                // the cake is drawn in a 400-wide space
const NEED = 520;              // how much cutting (in that space) completes the cake
let scale = 1, cutLen = 0, last = null, drawing = false, finished = false, leaving = false;

function size() {
  const r = wrap.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scale = r.width / VB;
}
size(); addEventListener('resize', size);

// the cake body (in cake space): bottom tier + top tier
const rects = [{ x: 50, y: 222, w: 300, h: 112 }, { x: 105, y: 142, w: 190, h: 82 }];
const onCake = (x, y) => rects.some(r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
function clipToCake() {
  ctx.beginPath();
  for (const r of rects) ctx.rect(r.x * scale, r.y * scale, r.w * scale, r.h * scale);
  ctx.clip();
}
function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

function drawCut(a, b) {
  ctx.save(); clipToCake(); ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(168,50,95,.9)'; ctx.lineWidth = 6 * scale;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.strokeStyle = '#fff3e6'; ctx.lineWidth = 2.6 * scale;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.restore();
}
function moveKnife(p, ang) {
  knife.style.transform = `translate(${p.x - 8}px,${p.y - 14}px) rotate(${ang}deg)`;
}

cv.addEventListener('pointerdown', e => {
  if (finished) return;
  cv.setPointerCapture(e.pointerId); drawing = true; last = pos(e);
  wrap.classList.add('started'); knife.classList.add('on'); moveKnife(last, -25);
});
cv.addEventListener('pointermove', e => {
  if (!drawing || finished) return;
  const p = pos(e), dx = p.x - last.x, dy = p.y - last.y, len = Math.hypot(dx, dy);
  moveKnife(p, Math.max(-70, Math.min(20, Math.atan2(dy, dx) * 57.3 - 20)));
  if (len < 2) return;
  const mid = { x: (p.x + last.x) / 2 / scale, y: (p.y + last.y) / 2 / scale };
  if (onCake(mid.x, mid.y)) {                 // only slices that touch the cake count
    drawCut(last, p);
    const before = cutLen; cutLen += len / scale;
    if (Math.floor(before / 60) !== Math.floor(cutLen / 60)) {   // little crumbs/hearts as you cut
      const r = cv.getBoundingClientRect(); burst(r.left + p.x, r.top + p.y, 3);
    }
    const pct = Math.min(1, cutLen / NEED);
    fill.style.width = pct * 100 + '%';
    msg.textContent = pct < .35 ? 'Nice, keep going…' : pct < .75 ? 'Almost there! ✂️' : 'One more slice…';
    if (pct >= 1) finish();
  }
  last = p;
});
const stop = () => { drawing = false; knife.classList.remove('on'); };
cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);

function finish() {
  finished = true; stop(); cv.style.pointerEvents = 'none';
  wrap.classList.add('cut', 'out');
  hint.textContent = 'You cut the cake! Now make a wish… 🌟';
  msg.textContent = 'Happy Birthday, my love! 🎂💗';
  const r = wrap.getBoundingClientRect();
  [0, 250, 500, 750].forEach((t, i) => setTimeout(() => burst(r.left + r.width * (.25 + .17 * i), r.top + r.height * .35, 26), t));
  document.getElementById('go').classList.add('show');
  document.getElementById('skip').style.display = 'none';
  setTimeout(next, 6500);
}
function next() { if (leaving) return; leaving = true; goTo('birthday.html'); }
document.getElementById('go').addEventListener('click', next);
document.getElementById('skip').addEventListener('click', next);
</script>
</body>
</html>
