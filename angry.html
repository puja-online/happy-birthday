<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How dare you!</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="oops">
  <div class="card angry">
    <div class="bear shake" data-teddy="angry"></div>
    <h1>How dare you type NO?!</h1>
    <p>Hmph! Three times?! I made this whole surprise just for you, and my fluffy heart is very offended. 😤<br>Go back and click YES, and I might forgive you. 💗</p>
    <button class="btn" id="back">Okay, okay… back to YES</button>
  </div>
</main>
<script src="script.js"></script>
<script>
document.getElementById('back').addEventListener('click', () => {
  window.close();   // works when the tab was opened by the question page
  setTimeout(() => { document.querySelector('p').textContent = 'You can close this tab and click YES 💗'; }, 300);
});
</script>
</body>
</html>
